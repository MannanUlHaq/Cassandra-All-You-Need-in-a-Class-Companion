<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Notes Library - Cassandra AI Class Companion">
  <title>Teacher Notes Library | Cassandra</title>
  <link rel="icon" type="image/png" href="Assets/favicon.png">
  
  <!-- Google Fonts: Bricolage Grotesque exclusively -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Premium SaaS Design System & Dashboard Variable Matches */
    :root {
      /* Brand Colors */
      --primary: #0060e7;
      --primary-dark: #004ba8;
      --primary-light: #3082ff;
      --primary-alpha: rgba(0, 96, 231, 0.1); /* Matched dashboard */
      
      /* UI Colors */
      --bg-body: #f4f7f9;
      --bg-surface: #ffffff;
      --bg-main: #F8FAFC;
      
      /* Typography Colors */
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-secondary: #475569;
      
      /* Layout & Spacing */
      --border-color: #e2e8f0;
      --spacing-xs: 0.25rem;
      --spacing-sm: 0.5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      
      /* Components */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      
      /* Shadows & Animations */
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-hover: 0 10px 15px -3px rgba(0, 96, 231, 0.1), 0 4px 6px -2px rgba(0, 96, 231, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.03);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Global Reset & Typography */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Bricolage Grotesque', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.5;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; }
    
    /* Layout Structure */
    .app-container {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* === EXACT SIDEBAR MATCH FROM DASHBOARD === */
    .sidebar { width: 280px; background-color: var(--bg-surface); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: var(--transition); z-index: 40; }
    .sidebar-header { padding: var(--spacing-lg); display: flex; align-items: center; border-bottom: 1px solid var(--border-color); height: 80px; }
    .sidebar-header img { height: 40px; width: auto; object-fit: contain; transition: var(--transition); }
    .sidebar-header img:hover { transform: scale(1.05); }
    .sidebar-nav { padding: var(--spacing-md); flex: 1; overflow-y: auto; }
    .sidebar-nav-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; margin: var(--spacing-md) 0 var(--spacing-sm) var(--spacing-sm); }
    .sidebar-nav-item { display: flex; align-items: center; gap: var(--spacing-md); padding: 10px 16px; color: var(--text-main); text-decoration: none; border-radius: var(--radius-sm); font-weight: 500; transition: var(--transition); margin-bottom: 4px; cursor: pointer; }
    .sidebar-nav-item:hover { background-color: var(--bg-body); transform: translateX(4px); }
    .sidebar-nav-item.active { background-color: var(--primary-alpha); color: var(--primary); font-weight: 600; }
    .sidebar-nav-item.active i { color: var(--primary); }
    .sidebar-nav-item i { font-size: 1.1rem; color: var(--text-muted); width: 24px; text-align: center; transition: var(--transition); }
    .class-color-dot { width: 12px; height: 12px; border-radius: 50%; margin-left: 6px; margin-right: 6px; }

    /* Main Area */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Header Styles */
    .header {
      height: 80px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 0 var(--spacing-xl);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
      position: sticky;
      top: 0;
    }

    .sidebar-toggle {
      display: none;
      font-size: 1.5rem;
      color: var(--text-secondary);
      transition: var(--transition);
    }
    .sidebar-toggle:hover { color: var(--primary); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      margin-left: auto;
    }

    .header-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 1.25rem;
      transition: var(--transition);
      background: transparent;
    }

    .header-icon:hover {
      background-color: var(--bg-body);
      color: var(--primary);
      transform: scale(1.05);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      padding: var(--spacing-xl);
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    /* Page Header */
    .page-header {
      margin-bottom: var(--spacing-xl);
      animation: fadeInDown 0.5s ease-out;
    }

    .page-title {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .page-subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-top: 6px;
    }

    /* Search Input */
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: var(--bg-surface);
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-alpha);
    }

    /* Notes Grid & Cards */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: var(--spacing-lg);
    }

    .note-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: var(--spacing-lg);
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      opacity: 0;
      animation: fadeInUp 0.6s ease-out forwards;
      position: relative;
      overflow: hidden;
    }

    .note-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
      border-color: var(--primary-light);
    }

    .note-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-light), var(--primary-dark));
      opacity: 0;
      transition: var(--transition);
    }
    .note-card:hover::before { opacity: 1; }

    .note-preview {
      width: 52px;
      height: 52px;
      background: var(--primary-alpha);
      color: var(--primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: var(--spacing-md);
      transition: var(--transition);
    }
    
    .note-card:hover .note-preview {
      background: var(--primary);
      color: white;
      transform: scale(1.05) rotate(-5deg);
    }

    .note-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: var(--spacing-sm);
      line-height: 1.3;
    }

    .note-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: var(--spacing-md);
    }

    .note-meta-item {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .note-meta-item i {
      color: var(--text-secondary);
      width: 14px;
      text-align: center;
    }

    /* Buttons */
    .note-actions {
      display: flex;
      gap: var(--spacing-sm);
      margin-top: auto;
      padding-top: var(--spacing-md);
      border-top: 1px dashed var(--border-color);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-sm { padding: 8px 16px; font-size: 0.85rem; flex: 1; }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(0, 96, 231, 0.2);
    }
    
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      box-shadow: 0 6px 16px rgba(0, 96, 231, 0.3);
      transform: translateY(-1px);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--text-secondary);
      border-color: var(--border-color);
    }
    
    .btn-outline:hover:not(:disabled) {
      border-color: var(--text-main);
      color: var(--text-main);
      background-color: var(--bg-body);
    }
    
    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-secondary);
      border-color: var(--border-color);
    }

    /* Footer */
    .footer {
      padding: var(--spacing-lg) var(--spacing-xl);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      border-top: 1px solid var(--border-color);
      background: transparent;
      margin-top: auto;
    }

    /* Loading & Status States */
    .status-container {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem;
      text-align: center;
      color: var(--text-muted);
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-color);
    }
    .status-container i { font-size: 2.5rem; color: var(--primary); margin-bottom: 1rem; }
    .status-container h3 { color: var(--text-main); margin-bottom: 0.5rem; }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsiveness */
    @media (max-width: 1024px) {
      .sidebar {
        position: fixed;
        left: -280px;
        height: 100vh;
        box-shadow: var(--shadow-lg);
      }
      .sidebar.open { left: 0; }
      .sidebar-toggle { display: block; }
      .header { padding: 0 var(--spacing-md); }
      .header-container { width: 100%; display: flex; align-items: center; justify-content: space-between;}
    }

    @media (max-width: 640px) {
      .page-header { flex-direction: column; align-items: flex-start; }
      .form-input { width: 100% !important; }
      .notes-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- === EXACT SIDEBAR HTML FROM DASHBOARD === -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="teacher-dashboard.html" class="logo" style="text-decoration: none;">
          <img src="Assets/Cassandra-Logo.png" alt="Cassandra" onerror="this.outerHTML='<h2 style=\'color: var(--primary); font-weight: 800; font-size: 1.5rem; margin: 0; text-decoration: none;\'>Cassandra.</h2>'">
        </a>
      </div>
      
      <nav class="sidebar-nav">
        <p class="sidebar-nav-title">Main Menu</p>
        <a href="teacher-dashboard.html" class="sidebar-nav-item">
          <i class="fas fa-home"></i> <span>Dashboard</span>
        </a>
        
        <p class="sidebar-nav-title" style="margin-top: var(--spacing-lg);">Your Classes</p>
        <div id="sidebarClassesList">
            <span style="font-size: 0.8rem; color: var(--text-muted); padding-left: 1rem;">Loading...</span>
        </div>
        
        <p class="sidebar-nav-title" style="margin-top: var(--spacing-lg);">Account</p>
        <a href="teacher-profile.html" class="sidebar-nav-item">
          <i class="fas fa-user"></i> <span>Profile</span>
        </a>
        <a onclick="logoutUser()" class="sidebar-nav-item" style="cursor: pointer;">
          <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      
      <!-- Header -->
      <header class="header">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <i class="fas fa-bars"></i>
        </button>
        
        <div class="header-actions">
          <a href="teacher-profile.html" class="header-icon" title="Profile">
            <i class="fas fa-user-circle"></i>
          </a>
          <a onclick="logoutUser()" class="header-icon" title="Logout" style="cursor: pointer;">
            <i class="fas fa-sign-out-alt"></i>
          </a>
        </div>
      </header>

      <!-- Main Scrollable Area -->
      <main class="main-content">
        <!-- Page Header -->
        <header class="page-header" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: var(--spacing-md);">
          <div>
            <h1 class="page-title">Notes Library</h1>
            <p class="page-subtitle">Access all your AI-generated lecture notes in one place.</p>
          </div>
          <div style="display: flex; gap: var(--spacing-md); width: auto;">
            <div style="position: relative;">
              <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
              <input 
                type="text" 
                id="searchInput"
                placeholder="Search notes..."
                class="form-input"
                style="padding-left: 2.75rem; width: 300px;"
              >
            </div>
          </div>
        </header>

        <!-- Notes Grid -->
        <section class="notes-grid" id="notesGrid">
          
          <!-- Default empty state -->
          <div class="status-container" style="grid-column: 1 / -1;">
            <i class="fas fa-book-open" style="color: var(--text-muted);"></i>
            <h3>No Course Selected</h3>
            <p>Please select a course from the sidebar to view its generated lecture notes.</p>
          </div>

        </section>

        <!-- Pagination -->
        <nav style="display: flex; justify-content: center; margin-top: var(--spacing-xl); padding-bottom: var(--spacing-md);">
          <div style="display: flex; gap: var(--spacing-sm);">
            <button class="btn btn-sm btn-secondary" style="opacity: 0.5; pointer-events: none;">
              <i class="fas fa-chevron-left"></i> Previous
            </button>
            <button class="btn btn-sm btn-primary">1</button>
            <button class="btn btn-sm btn-outline">2</button>
            <button class="btn btn-sm btn-outline">3</button>
            <button class="btn btn-sm btn-outline">
              Next <i class="fas fa-chevron-right"></i>
            </button>
          </div>
        </nav>
        
        <!-- Footer -->
        <footer class="footer">
          <p>© 2025 Cassandra | AI Class Companion</p>
        </footer>

      </main>
    </div>
  </div>

  <script>
    // --- UI Interactions ---
    const sidebar = document.getElementById('sidebar');
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // Client-side Search Filtering
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const term = e.target.value.toLowerCase();
      const cards = document.querySelectorAll('.note-card');
      cards.forEach(card => {
        const title = card.querySelector('.note-title').textContent.toLowerCase();
        if (title.includes(term)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    });

    // --- Supabase Integration Logic ---
    const SUPABASE_URL = 'https://lchcfsgexlkjxrhfjrna.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjaGNmc2dleGxranhyaGZqcm5hIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2MDI4NDIxNywiZXhwIjoyMDc1ODYwMjE3fQ.u8xbJWho6qFVW5f7tmhtK9hq5X5ApQVC4QK04jfjj0k'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // Sidebar Logic Data
    let currentTeacherId = null;
    const colorsList = ['blue', 'green', 'purple', 'amber', 'rose'];
    const colorHexMap = { blue: '#3b82f6', green: '#10b981', purple: '#8b5cf6', amber: '#f59e0b', rose: '#f43f5e' };
    const urlParams = new URLSearchParams(window.location.search);
    const activeCourseId = urlParams.get('id');

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Authenticate & load dynamic sidebar
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) {
          currentTeacherId = session.user.id;
          await loadSidebarClasses();
      } else {
          // If no session, fallback
          document.getElementById('sidebarClassesList').innerHTML = '<span style="font-size: 0.8rem; color: #ef4444; padding-left: 1rem;">Please login to see classes.</span>';
      }

      // 2. Check for Course ID in URL to fetch specific notes
      if (activeCourseId) {
        await loadNotesFromSupabase(activeCourseId);
      }
    });

    // Exact logic from Teacher Dashboard to load the classes into the sidebar dynamically
    async function loadSidebarClasses() {
        const sidebarList = document.getElementById('sidebarClassesList');
        
        const { data: classes, error } = await supabaseClient
            .from('class')
            .select('*')
            .eq('teacher_id', currentTeacherId)
            .order('course_name', { ascending: true });

        if (error) {
            sidebarList.innerHTML = '<span style="color:red; font-size: 0.8rem; padding-left: 1rem;">Error loading classes.</span>';
            return;
        }

        sidebarList.innerHTML = '';
        if (classes.length === 0) {
            sidebarList.innerHTML = '<span style="font-size: 0.8rem; color: var(--text-muted); padding-left: 1rem;">No classes found.</span>';
            return;
        }

        classes.forEach((cls, index) => {
            const colorName = colorsList[index % colorsList.length];
            const hexColor = colorHexMap[colorName] || 'var(--primary)';
            
            let displayName = cls.class_name;
            if (displayName && displayName.includes(' - ')) {
                displayName = displayName.split(' - ')[0];
            }

            const sidebarItem = document.createElement('a');
            sidebarItem.className = 'sidebar-nav-item';
            // Highlight active course based on URL Param
            if (cls.course_id === activeCourseId) {
                sidebarItem.classList.add('active');
            }
            
            // Link to the notes page for this specific course
            sidebarItem.onclick = () => window.location.href = `teacher-notes.html?id=${cls.course_id}`;
            sidebarItem.innerHTML = `
                <div class="class-color-dot" style="background-color: ${hexColor};"></div>
                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${displayName}</span>
            `;
            sidebarList.appendChild(sidebarItem);
        });
    }

    async function loadNotesFromSupabase(courseId) {
      const grid = document.getElementById('notesGrid');
      
      grid.innerHTML = `
        <div class="status-container">
          <i class="fas fa-circle-notch fa-spin"></i>
          <h3>Connecting to Knowledge Base...</h3>
          <p>Fetching your generated lecture notes securely.</p>
        </div>
      `;

      try {
        const { data: lectureFolders, error: folderError } = await supabaseClient
          .storage
          .from('generated_notes')
          .list(courseId, { limit: 100 });

        if (folderError) throw folderError;

        if (!lectureFolders || lectureFolders.length === 0) {
          grid.innerHTML = `
            <div class="status-container">
              <i class="fas fa-folder-open" style="color: var(--text-muted);"></i>
              <h3>No Lectures Found</h3>
              <p>Generate your first set of AI notes to see them here.</p>
            </div>
          `;
          return;
        }

        let dynamicHtml = '';
        let hasValidNotes = false;

        for (const folder of lectureFolders) {
          if (folder.name === '.emptyFolderPlaceholder') continue; 
          
          const lectureName = folder.name.replace(/_/g, ' '); 

          const { data: files, error: fileError } = await supabaseClient
            .storage
            .from('generated_notes')
            .list(`${courseId}/${folder.name}`, { limit: 100 });
            
          if (fileError) continue;

          const expectedFileName = `${courseId}_${folder.name}.html`;
          const htmlFile = files.find(f => f.name === expectedFileName || f.name.endsWith('.html'));

          if (htmlFile) {
            hasValidNotes = true;
            
            let fileUrl = '#';
            const { data: signedUrlData } = await supabaseClient
              .storage
              .from('generated_notes')
              .createSignedUrl(`${courseId}/${folder.name}/${htmlFile.name}`, 60 * 60 * 24); 
            
            if (signedUrlData && signedUrlData.signedUrl) {
              fileUrl = signedUrlData.signedUrl;
            } else {
              const { data: publicUrlData } = supabaseClient
                .storage
                .from('generated_notes')
                .getPublicUrl(`${courseId}/${folder.name}/${htmlFile.name}`);
              fileUrl = publicUrlData.publicUrl;
            }
            
            let dateStr = "Recently Generated";
            if (htmlFile.created_at || folder.created_at) {
               const dateObj = new Date(htmlFile.created_at || folder.created_at);
               dateStr = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            }

            // REPLACED anchor tag with a button that triggers dynamic rendering logic
            dynamicHtml += `
              <article class="note-card">
                <div class="note-preview"><i class="fas fa-file-code"></i></div>
                <div class="note-content" style="display:flex; flex-direction:column; height: 100%;">
                  <h3 class="note-title">${lectureName}</h3>
                  <div class="note-meta">
                    <span class="note-meta-item"><i class="fas fa-calendar"></i> ${dateStr}</span>
                  </div>
                  <div class="note-actions">
                    <button onclick="viewLectureHTML(event, '${fileUrl}', '${courseId}', '${folder.name}')" class="btn btn-sm btn-primary">
                      <i class="fas fa-eye"></i> View
                    </button>
                    <a href="teacher-notes-editor.html?note_id=${folder.name}&course_id=${courseId}" class="btn btn-sm btn-outline">
  <i class="fas fa-edit"></i> Edit
</a>
                  </div>
                </div>
              </article>
            `;
          }
        }

        if (hasValidNotes) {
          grid.innerHTML = dynamicHtml;
          const cards = grid.querySelectorAll('.note-card');
          cards.forEach((c, idx) => c.style.animationDelay = `${(idx % 10) * 0.08}s`);
        } else {
          grid.innerHTML = `
            <div class="status-container">
              <i class="fas fa-file-excel" style="color: var(--text-muted);"></i>
              <h3>No HTML Notes Found</h3>
              <p>The folders exist, but no .html lecture files were located inside them.</p>
            </div>
          `;
        }

      } catch (err) {
        console.error("Error fetching notes:", err);
        grid.innerHTML = `
          <div class="status-container" style="color: #EF4444; border-color: #FECACA;">
            <i class="fas fa-exclamation-triangle" style="color: #EF4444;"></i>
            <h3>Connection Error</h3>
            <p>Unable to retrieve notes from the bucket. Ensure you have access privileges.</p>
          </div>
        `;
      }
    }

    // --- NEW LOGIC: Intercept raw HTML files and explicitly render them + fix relative images ---
    async function viewLectureHTML(event, fileUrl, courseId, folderName) {
      const btn = event.currentTarget;
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
      btn.disabled = true;

      try {
        // Fetch the raw HTML code snippet 
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error('Failed to fetch file content');
        let htmlText = await response.text();

        // Since the bucket is private, we must generate SIGNED URLs for every media asset inside the HTML
        const mediaRegex = /(?:src|href)=["'](?:\.\/)?(media\/[^"']+)["']/gi;
        const mediaPaths = new Set();
        let match;
        
        // Find all unique media paths in the HTML
        while ((match = mediaRegex.exec(htmlText)) !== null) {
          mediaPaths.add(match[1]); // e.g., 'media/image1.png'
        }

        // Generate and replace with signed URLs securely
        for (const path of mediaPaths) {
          const { data: signedData } = await supabaseClient
            .storage
            .from('generated_notes')
            .createSignedUrl(`${courseId}/${folderName}/${path}`, 60 * 60 * 24); // 24hr expiry

          if (signedData && signedData.signedUrl) {
            // Replace both exact matches (with and without ./) safely without breaking syntax
            htmlText = htmlText.split(`"${path}"`).join(`"${signedData.signedUrl}"`);
            htmlText = htmlText.split(`"./${path}"`).join(`"${signedData.signedUrl}"`);
            htmlText = htmlText.split(`'${path}'`).join(`'${signedData.signedUrl}'`);
            htmlText = htmlText.split(`'./${path}'`).join(`'${signedData.signedUrl}'`);
          }
        }

        // Open a new window and force the browser to render it as a proper webpage
        const newWindow = window.open('', '_blank');
        if (newWindow) {
          newWindow.document.open();
          newWindow.document.write(htmlText);
          newWindow.document.close();
        } else {
          alert('Please allow pop-ups to view the notes.');
        }

      } catch (err) {
        console.error("View Error:", err);
        alert("Failed to open lecture notes. Please ensure you have network access.");
      } finally {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }
    }
    
    async function logoutUser() { 
        await supabaseClient.auth.signOut(); 
        window.location.href = 'teacher-login.html'; // Or wherever login resides
    }
  </script>
